<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>לוח בקרה אקדמי</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Warm paper palette */
    --paper: #F5F1EA;
    --paper-2: #EFEAE0;
    --paper-3: #E8E2D5;
    --ink: #1C1B19;
    --ink-2: #3C3A35;
    --ink-3: #6F6B62;
    --ink-4: #A39E92;
    --line: #DCD5C5;
    --line-strong: #C8C0AC;
    --card: #FBF8F2;
    --card-hover: #FFFCF5;
    --accent: #D9633A;            /* warm terracotta */
    --accent-2: #2F5D50;          /* deep moss */
    --accent-3: #2B4A6F;          /* ink blue */

    /* Urgency */
    --urg-high: #C24A2A;
    --urg-med:  #C99B2C;
    --urg-low:  #6B8E5A;

    /* Importance */
    --imp-high: #1C1B19;
    --imp-med:  #6F6B62;
    --imp-low:  #A39E92;

    /* Subject colors (distinct, muted, scannable) */
    --sub-projects:   #2B4A6F;
    --sub-money:      #5A6B2C;
    --sub-university: #6B3B7A;
    --sub-friends:    #C24A2A;
    --sub-errands:    #8C6A2C;
    --sub-health:     #2F5D50;
    --sub-other:      #6F6B62;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 20px;

    --shadow-1: 0 1px 0 rgba(28,27,25,.04), 0 1px 2px rgba(28,27,25,.05);
    --shadow-2: 0 1px 0 rgba(28,27,25,.04), 0 4px 16px -4px rgba(28,27,25,.10);
    --shadow-3: 0 8px 32px -8px rgba(28,27,25,.18);

    --font-sans: "Inter Tight", "Heebo", system-ui, sans-serif;
    --font-serif: "Instrument Serif", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  /* Dark mode override */
  html[data-theme="dark"]{
    --paper: #1A1A1A;
    --paper-2: #1F1E1C;
    --paper-3: #252320;
    --ink: #F0EBDF;
    --ink-2: #D4CFC2;
    --ink-3: #948F82;
    --ink-4: #5C594F;
    --line: #2E2C28;
    --line-strong: #3D3A33;
    --card: #232220;
    --card-hover: #2A2825;
    --accent: #E8784D;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    font-family: var(--font-sans);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11";
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }

  /* Grain texture overlay */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: radial-gradient(rgba(28,27,25,.025) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: .6;
  }

  #root { position: relative; z-index: 1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid var(--paper); }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }

  /* Selection */
  ::selection { background: var(--accent); color: var(--paper); }

  /* RTL fixes when lang=he */
  html[dir="rtl"] .rtl-flip { transform: scaleX(-1); }
  html[dir="rtl"] body { font-family: "Heebo", "Inter Tight", sans-serif; }

  /* Done-fade animation for auto-delete */
  @keyframes done-fade-out {
    0% { opacity: 1; transform: translateY(0) scale(1); max-height: 200px; }
    60% { opacity: 0.2; transform: translateY(0) scale(.98); }
    100% { opacity: 0; transform: translateY(-4px) scale(.96); max-height: 0; margin-top: -8px; padding-top: 0; padding-bottom: 0; border-width: 0; }
  }
  .task-fading {
    animation: done-fade-out 0.7s cubic-bezier(.4,0,.2,1) forwards;
    pointer-events: none;
    overflow: hidden;
  }

  /* Spring keyframes */
  @keyframes spring-in {
    0% { opacity: 0; transform: translateY(-6px) scale(.97); }
    60% { opacity: 1; transform: translateY(2px) scale(1.005); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes shimmer-stripe {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes pulse-soft {
    0%, 100% { opacity: 1; }
    50% { opacity: .55; }
  }
  @keyframes thinking-dot {
    0%, 80%, 100% { transform: scale(0.6); opacity: .4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .rtl { direction: rtl; text-align: right; font-family: "Heebo", "Inter Tight", sans-serif; }

  /* Utility */
  .serif { font-family: var(--font-serif); font-weight: 400; }
  .mono { font-family: var(--font-mono); }
</style>
